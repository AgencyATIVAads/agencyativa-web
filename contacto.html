
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hablemos | ATIVA Digital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="pagina-contacto">

    <main class="contacto-pagina">

        <a href="index.html" class="contacto-volver">← Volver a Agency ATIVA</a>

        <div class="contacto-contenedor">

            <h1>Cuéntame sobre tu <span>proyecto</span></h1>

            <p class="contacto-intro">
                Déjame algunos datos sobre tu negocio para poder preparar tu propuesta.
            </p>

            <form
    class="formulario-contacto"
    action="https://formsubmit.co/yolanda@agencyativa.com"
    method="POST"
>

<input type="hidden" name="_subject" value="Nueva solicitud desde Agency ATIVA">
<input
    type="hidden"
    name="_autoresponse"
    value="Hemos recibido tu solicitud 💜 Hola 👋🏼 Gracias por contactar con Agency ATIVA. Revisaremos tu solicitud y nos pondremos en contacto contigo lo antes posible. Estamos cuando nos necesitas. Tu negocio es nuestro compromiso. — Yolanda Flores | Agency ATIVA"
>

<input type="hidden" name="_next" value="https://agencyativa.com/gracias.html">

                <label for="nombre">Nombre y apellidos *</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                >

                <label for="email">Correo electrónico *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="telefono">Teléfono *</label>
                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    required
                >

                <label for="url">URL del negocio *</label>
                <input
                    type="url"
                    id="url"
                    name="url"
                    placeholder="https://"
                    required
                >

                <label for="mensaje">
                    ¿Qué debería saber para preparar la propuesta?
                </label>
                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                ></textarea>

                <button type="submit">ENVIAR SOLICITUD →</button>

            </form>

        </div>

    </main>

</body>
</html>
